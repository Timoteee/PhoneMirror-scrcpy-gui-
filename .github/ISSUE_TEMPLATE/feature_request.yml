name: Feature request
description: Suggest a change to Phone Mirror
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Phone Mirror is a control panel for scrcpy. The mirror window stays scrcpy's. A request that fits that job is easier to act on.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The phone, the task, and where the current window gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Phone Mirror to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: A scrcpy flag, another app, or a workaround. Optional.
  - type: dropdown
    id: scrcpy
    attributes:
      label: Does scrcpy already support this?
      options:
        - Yes, it is a flag Phone Mirror does not expose
        - No, scrcpy would need it first
        - I am not sure
    validations:
      required: true
